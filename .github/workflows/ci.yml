name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - run: python -m unittest discover -s tests -v
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm audit --audit-level=high
        working-directory: frontend
      - run: python -m pip wheel . --no-deps -w dist
      - run: cargo test --locked --manifest-path rust-indexer/Cargo.toml
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: python -m unittest discover -s tests -v
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - run: python -m pip install pyinstaller==6.22.3 Pillow==12.3.0
      - run: choco install innosetup --yes --no-progress
      - run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build-windows.ps1
      - run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/smoke-windows.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Modelmeter-Windows-Installer
          path: dist/Modelmeter-Setup-0.7.1-win-x64.exe
          if-no-files-found: error
