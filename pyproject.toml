[project]
name = "tallybeam"
version = "0.5.0"
description = "Local-first AI token usage dashboard"
requires-python = ">=3.10"

[project.scripts]
tallybeam = "tallybeam.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["tallybeam"]

[tool.setuptools.package-data]
tallybeam = ["static/*", "static/assets/*"]
